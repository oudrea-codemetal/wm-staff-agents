# Doctrine corpus pointer.
# Points to the doctrine documents and the DCF convention directory.
# An administrator can add documents here; the corpus builder picks them up.

corpus_name: south_china_sea_doctrine
corpus_dir: data/doctrine/corpus

# Source documents (open-source, stored in data/doctrine/sources/).
# Each should have a public URL or local path.
sources:
  - document: AFDP 3-01 Counterair
    publication: Air Force Doctrine Publication 3-01, Counterair Operations (2023)
    path: data/doctrine/sources/3-01-AFDP-COUNTERAIR.pdf
    url: https://www.doctrine.af.mil/Doctrine-Publications/AFDP-3-01-Counterair-Ops/

  - document: AFDP 3-03 Counterland
    publication: Air Force Doctrine Publication 3-03, Counterland Operations
    path: data/doctrine/sources/3-03-AFDP-COUNTERLAND.pdf
    url: https://www.doctrine.af.mil/Doctrine-Publications/AFDP-3-03-Counterland-Ops/

  - document: AFDP 3-36 Mobility Operations
    publication: Air Force Doctrine Publication 3-36, Air Mobility Operations
