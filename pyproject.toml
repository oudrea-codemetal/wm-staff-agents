[project]
name = "wm-staff-agents"
version = "0.1.0"
description = "Hierarchical wargaming with WarMatrix via MCP, StaffEngine roles, and doctrine-grounded agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6",
    "httpx>=0.28,<1",
    "slack-sdk>=3",
    "jinja2>=3.1",
    "mcp>=1.9,<3",
    "warmatrix-mcp @ git+https://github.com/CodeMetalAI/warmatrix-mcp.git",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "basedpyright", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wm_staff_agents"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
